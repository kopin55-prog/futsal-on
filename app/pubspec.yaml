name: futsal_on
description: "풋살ON (Futsal ON) - 풋살 팀 매니저"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

# 외부 패키지는 kopn 승인 후에만 추가한다 (lead 지시, 스프린트 01).
dependencies:
  flutter:
    sdk: flutter
  # 보이는 글자(grapheme) 단위 글자 수 세기. Flutter SDK 포함 패키지 (Q-012 승인).
  characters: ^1.4.0
  # 로그인·서버 연결 (Q-004 로그인 관련 라이브러리 허용). 애플 로그인(sign_in_with_apple)은 유료 계정 이후.
  supabase_flutter: ^2.18.3
  kakao_flutter_sdk_user: ^2.1.0
  google_sign_in: ^7.2.0
  # 로그인 nonce(재사용 방지값)의 SHA-256 (Q-004 로그인 관련 라이브러리 허용). 이미 supabase_flutter 가 쓰는 패키지.
  crypto: ^3.0.8
  # 구글 로그인마다 새 nonce 를 넘기기 위한 플랫폼 초기화 (google_sign_in 이 쓰는 패키지, Q-004).
  google_sign_in_platform_interface: ^3.1.0
  # 마지막으로 본 팀 기억 (기기 안 저장). supabase_flutter 가 세션 저장에 이미 쓰는 패키지.
  # TODO(lead 확인): 직접 의존성으로 올린 것 (새 패키지 추가 아님, 기존 묶음 안의 패키지).
  shared_preferences: ^2.5.6
  # 로고 사진 고르기·정사각형 자르기 (Q-068 1번 승인). 위치 정보 제거·축소는 앱 코드(dart:ui)로 다시 인코딩.
  image_picker: ^1.2.4
  image_cropper: ^12.2.1
  # 안드로이드 푸시 받기 (Q-031 허용). 설정 파일 android/app/google-services.json 은 git 제외.
  # 설정 파일이 없으면(테스트·CI) 푸시만 꺼지고 앱은 그대로 동작한다 (FirebasePushMessaging.tryCreate).
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  # 공유 이미지를 휴대폰 공유 창으로 (Q-075 11번 승인, S3-11 A). path_provider 등은 share_plus 가 쓰는 패키지.
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
